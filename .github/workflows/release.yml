name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Analysis
        run: flutter analyze

      - name: Determine Auto-Incrementing Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            CLEAN_VERSION="1.0.${{ github.run_number }}"
            TAG="v${CLEAN_VERSION}"
          fi
          # Monotonically increasing Android versionCode (offset +10 to exceed initial test builds)
          BUILD_NUMBER=$(( ${{ github.run_number }} + 10 ))
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versioning.outputs.version }}" \
            --build-number="${{ steps.versioning.outputs.build_number }}"

      - name: Generate Checksums & Release Notes
        id: prep_release
        run: |
          cd build/app/outputs/flutter-apk/
          sha1sum app-release.apk > app-release.apk.sha1
          sha256sum app-release.apk > app-release.apk.sha256
          
          SHA1_VAL=$(awk '{print $1}' app-release.apk.sha1)
          SHA256_VAL=$(awk '{print $1}' app-release.apk.sha256)
          
          echo "# WattageApp Verification Checksums" > checksums.txt
          echo "SHA-1:   $SHA1_VAL" >> checksums.txt
          echo "SHA-256: $SHA256_VAL" >> checksums.txt
          
          cd -
          
          TAG="${{ steps.versioning.outputs.tag }}"
          
          # Extract commit message & author
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          # Create formatted release notes
          cat <<EOF > release_notes.md
          ## ⚡ Wattage ${TAG} (Build ${{ steps.versioning.outputs.build_number }})
          
          ### 📝 Commit Message & Changes:
          > **${COMMIT_TITLE}**
          
          ${COMMIT_BODY}
          
          ---
          
          ### 📱 Device Profile:
          * **Target**: Nothing Phone (4a) [Nothing OS 4.1 / Android 16]
          * **Version**: \`${TAG}\` (versionCode: \`${{ steps.versioning.outputs.build_number }}\`)
          * **Features**: Live Wattage ($P=V \times I$), 4a Dot-Matrix Glyph Bar, Adaptive Gauge, Hardware Battery & System Telemetry.
          * **Build Commit**: \`${COMMIT_HASH}\`
          
          ---
          
          ### 🔐 Integrity Checksums:
          | Algorithm | Checksum Hash |
          |---|---|
          | **SHA-1** | \`${SHA1_VAL}\` |
          | **SHA-256** | \`${SHA256_VAL}\` |
          EOF
          
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=Wattage ${TAG}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_release.outputs.tag_name }}
          name: ${{ steps.prep_release.outputs.release_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/app/outputs/flutter-apk/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
